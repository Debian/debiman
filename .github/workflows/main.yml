name: Push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    name: CI
    runs-on: ubuntu-latest
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Set up Go 1.x
      uses: actions/setup-go@v5
      with:
        # Run on the latest stable release of Go, e.g. 1.26.9
        go-version: stable

    - name: Ensure all files were formatted as per gofmt
      run: |
        [ "$(gofmt -l $(find . -name '*.go') 2>&1)" = "" ] || { gofmt -l $(find . -name '*.go'); false; }

    - name: Install dependency Debian packages
      run: sudo apt-get install debian-archive-keyring

    - name: Run tests
      run: |
        /usr/lib/apt/apt-helper download-file https://people.debian.org/~stapelberg/mandoc_dfgk5ayl54saxinl4mvndg9gxah8wqyp/mandoc mandoc SHA256:2ef03df7084f14e6be8fa6b4b8f979a91c5783d310bf0c5a649106551e440a8f
        /usr/lib/apt/apt-helper download-file https://people.debian.org/~stapelberg/mandoc_dfgk5ayl54saxinl4mvndg9gxah8wqyp/mandocd mandocd SHA256:b9ce308ec79ce0175cc2e85b29e325ad36afc7678ccda0864d2e143560ecf63c
        chmod +x mandoc mandocd
        ./mandoc -V
        PATH=$PWD:$PATH go test ./...
